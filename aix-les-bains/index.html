<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balade Belle Époque · Aix-les-Bains</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f3;--ink:#1d2430;--mute:#6b7280;--lake:#1f6f8b;--gold:#b8862b;--card:#fff;--line:#e7e0d4;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
#map{position:fixed;inset:0;bottom:var(--sheet,42vh);z-index:1;background:#e8e4dc}
header{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(#fbf8f3f2,#fbf8f3d0 70%,#fbf8f300);pointer-events:none}
header h1{font:700 21px/1.1 "Playfair Display",Georgia,serif;margin:0}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.fab{position:fixed;right:12px;z-index:6;bottom:calc(var(--sheet,42vh) + 12px);display:flex;flex-direction:column;gap:8px}
.fab button{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px #0003;font-size:20px;color:var(--lake);display:grid;place-items:center}
.fab button.on{background:var(--lake);color:#fff}
#sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sheet,42vh);z-index:7;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px #0002;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#grip{padding:8px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
#grip i{width:40px;height:5px;border-radius:3px;background:#d6d0c4}
#next{margin:0 14px 8px;padding:10px 12px;border-radius:12px;background:#f3efe6;font-size:14px;display:flex;gap:10px;align-items:center}
#next b{font-weight:600}
#next .d{margin-left:auto;font-weight:600;color:var(--lake);white-space:nowrap}
ol{list-style:none;margin:0;padding:0 8px 20px;overflow-y:auto;flex:1}
li{display:flex;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
li.done .num{background:#9ca3af}
li.done h3{color:var(--mute);text-decoration:line-through}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;font-weight:600;display:grid;place-items:center;font-size:14px}
.txt{flex:1}
.txt h3{margin:0;font-size:15.5px;font-weight:600}
.txt p{margin:3px 0 0;color:var(--mute);font-size:13.5px}
.meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
.meta a,.meta button{font:500 13px Inter,sans-serif;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--lake);text-decoration:none}
.dist{font-size:13px;font-weight:600;color:var(--lake);white-space:nowrap}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gold);border:2px solid #fff;box-shadow:0 2px 6px #0005;display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font:600 13px Inter,sans-serif}
.pin.done{background:#9ca3af}
.pin.sel{background:var(--lake)}
.me{width:18px;height:18px;border-radius:50%;background:#2b7cff;border:3px solid #fff;box-shadow:0 0 0 6px #2b7cff33}
#msg{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);z-index:8;background:#1d2430;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;display:none;max-width:90vw;text-align:center}
#fiche{position:fixed;inset:0;z-index:20;background:#0006;display:none;align-items:flex-end}#fiche.open{display:flex}#fiche .box{background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom))}#fiche h2{font:700 24px/1.15 "Playfair Display",Georgia,serif;margin:6px 0 12px}#fiche p{font-size:16px;line-height:1.6;margin:0 0 12px}#fiche .look{background:#f3efe6;border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:15px}#fiche .top{display:flex;justify-content:space-between;align-items:center}#fiche .close{width:44px;height:44px;border:0;border-radius:50%;background:#ece6da;font-size:20px}#fiche .nav{display:flex;gap:10px;margin-top:16px}#fiche .nav button,#fiche .nav a{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font:500 14px Inter,sans-serif;color:var(--lake);text-decoration:none;display:grid;place-items:center}
.foot{padding:12px 8px;color:var(--mute);font-size:12px}
.leaflet-popup-content{font:14px/1.4 Inter,sans-serif;margin:10px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<header><h1>Aix-les-Bains Belle Époque</h1><p>11 étapes · ≈ 2,5 à 3 km · 1 h 30</p></header>
<div class="fab">
  <button id="locate" aria-label="Me localiser" title="Me localiser">◎</button>
  <button id="fit" aria-label="Voir tout le parcours" title="Voir tout le parcours">⤢</button>
</div>
<div id="msg"></div>
<div id="fiche" role="dialog" aria-modal="true"><div class="box" id="fbox"></div></div>
<section id="sheet">
  <div id="grip"><i></i></div>
  <div id="next"></div>
  <ol id="list"></ol>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
{
const S=[
 {n:"Place du Revard",d:"Point de départ. Elle tient son nom du mont Revard, la montagne qui domine la ville à l'est. À la Belle Époque, un train à crémaillère y emmenait les curistes. Au n° 3 se dresse le Grand Hôtel.",p:[45.6884,5.9139],a:1,x:{"m": ["La place porte le nom du mont Revard, le balcon montagneux qui ferme l'horizon à l'est de la ville. À la Belle Époque, le Revard était l'excursion à la mode : un chemin de fer à crémaillère y montait les curistes depuis Aix, et l'on y découvrait le lac du Bourget et, par temps clair, le Mont-Blanc.", "Ici se croisent la rue du Casino et le cœur de la ville thermale. L'immeuble du 2 place du Revard (31-33 rue du Casino) a été successivement remise, maison, Hôtel des Nations puis Restaurant-Hôtel Lamartine : un bon exemple de ces bâtiments sans cesse transformés au gré de la vogue thermale."], "l": "Lever les yeux vers la façade du Grand Hôtel au n° 3 et, au loin, chercher la silhouette du Revard."}},
 {n:"Rue de Genève",d:"La grande rue commerçante. Elle suit le tracé de l'ancienne route royale de Genève à Chambéry. Au début du XXe siècle, un tramway la parcourait.",p:[45.6893,5.9146],a:1,x:{"m": ["C'est l'artère historique d'Aix : elle reprend le tracé de l'ancienne route royale qui reliait Genève à Chambéry. Au XIXe siècle, une nouvelle route rectiligne fut tracée pour éviter le centre, empruntant l'actuelle rue du Casino, ce qui préserva le caractère de cette vieille rue.", "Au début du XXe siècle, un tramway la parcourait, entre boutiques, cafés et pensions de curistes. Elle est restée la principale rue commerçante de la ville."], "l": "Les étages au-dessus des vitrines : balcons en fer forgé, encadrements de fenêtres et enseignes anciennes."}},
 {n:"Ruelle du Revêt",d:"Une ruelle étroite qui forme un coude, entre la rue Davat et la place des Thermes. Elle garde le tracé tortueux de la vieille ville d'avant les palaces.",p:[45.6893,5.9157],a:1,x:{"m": ["Une ruelle étroite formant un coude, qui file entre la rue Davat, l'impasse de la Chaudanne et la place des Thermes. Son tracé irrégulier est un vestige du bourg d'avant la grande époque thermale.", "Les immeubles qui la bordent accueillaient des curistes à deux pas des Thermes : au 5 rue Davat, l'ancienne Pension Bossut donne sur la ruelle. On y trouve encore aujourd'hui un hôtel, au n° 10."], "l": "Le revers des immeubles et le coude de la ruelle, qui contraste avec les larges avenues des palaces."}},
 {n:"Place Carnot",d:"L'ancienne « place centrale » du bourg. C'est là que la rue de Genève devenait la route de Chambéry.",p:[45.6887,5.9143],a:1,x:{"m": ["Autrefois appelée « place centrale », c'était le point où la rue de Genève, arrivant du nord, devenait la route de Chambéry vers le sud. Elle porte aujourd'hui le nom de Carnot, comme de nombreuses places françaises rebaptisées en l'honneur du président Sadi Carnot à la fin du XIXe siècle.", "Elle fait la charnière entre la ville marchande et le quartier monumental : l'Hôtel de Ville, l'Arc de Campanus, le temple romain et les Thermes sont à quelques pas."], "l": "La perspective vers la rue de Genève et vers l'Hôtel de Ville."}},
 {n:"Hôtel de Ville & Arc de Campanus",d:"Le château des marquis d'Aix (XVIe siècle) est devenu mairie au XIXe siècle. Son escalier Renaissance réemploie des pierres romaines. Juste devant, l'Arc de Campanus est un monument funéraire romain du Ier siècle. Le temple romain dit « de Diane » est tout proche.",p:[45.68855,5.91478],x:{"m": ["Le bâtiment est l'ancien château des marquis d'Aix, de la famille de Seyssel, édifié au XVIe siècle. La ville l'a acquis au XIXe siècle pour y installer sa mairie. Son joyau est l'escalier Renaissance, dans lequel ont été remployées des pierres provenant de monuments romains.", "Devant, l'Arc de Campanus rappelle qu'Aix était déjà une ville d'eaux dans l'Antiquité (Aquae). Cet arc funéraire du Ier siècle, haut d'environ 9 mètres, fut élevé par Lucius Pompeius Campanus pour sa famille, dont les noms sont gravés dans la pierre.", "Juste à côté, le temple romain dit « de Diane » est l'un des mieux conservés de France ; et en face s'étendent les Thermes nationaux, bâtis sur les vestiges des bains romains."], "l": "L'escalier Renaissance (si la mairie est ouverte) et les inscriptions sur l'arc."}},
 {n:"Casino Grand Cercle",d:"Inauguré en 1850 par Victor-Emmanuel II, quand la Savoie était encore sarde. À l'intérieur : des plafonds en mosaïque et un théâtre à l'italienne.",p:[45.6886,5.9128],x:{"m": ["Commencé en 1847 et inauguré en 1850 par Victor-Emmanuel II, alors roi de Sardaigne : la Savoie ne deviendra française qu'en 1860. Il fut le lieu de sociabilité par excellence des curistes fortunés, entre salons de jeu, bals et spectacles.", "Il fut agrandi à la fin du XIXe siècle, au plus fort de la vogue d'Aix. On lui doit ses célèbres plafonds en mosaïque à fond d'or, dans le goût vénitien, et un théâtre à l'italienne. Rénové en 1988, il est classé monument historique."], "l": "Les mosaïques des plafonds : la partie patrimoniale se visite, et l'office de tourisme organise des visites guidées."}},
 {n:"Le Grand Hôtel",d:"Construit en 1858 par Pellegrini. Il s'est appelé Hôtel Royal, puis Impérial (1860), puis Grand-Hôtel d'Aix (1870). Il a été surélevé de deux étages vers 1900.",p:[45.68810,5.91357],x:{"m": ["Construit en 1858 par l'architecte aixois Charles-Bernard Pellegrini pour la société de l'Hôtel Royal de Savoie. Il change de nom au fil des régimes : Hôtel Royal, puis Hôtel Impérial en 1860 (l'année du rattachement de la Savoie à la France), et enfin Grand-Hôtel d'Aix en 1870, à la chute du Second Empire.", "Entre 1898 et 1902, les architectes chambériens Laurent Faga et Eugène Pierron le surélèvent de deux étages pour suivre l'afflux de clientèle. Il est réputé pour son grand atrium. Comme la plupart des palaces aixois, il est aujourd'hui transformé en logements."], "l": "La façade sur la place du Revard et la différence entre les étages d'origine et ceux ajoutés vers 1900."}},
 {n:"L'Hôtel de l'Europe",d:"D'abord Hôtel du Globe, puis Grand Hôtel de l'Europe, tenu par la famille Bernascon. La Villa Béatrice l'a agrandi en 1909. Il a été converti en appartements dans les années 1950 (immeuble Europe-Béatrice).",p:[45.6875,5.9141],a:1,x:{"m": ["Situé à l'angle de la rue du Casino, de l'avenue Victoria et de la rue Charles-Dullin, il s'appela d'abord Hôtel du Globe, avant de devenir le Grand Hôtel de l'Europe. Dans les années 1870, il était tenu par la famille Bernascon, qui fera ensuite construire son propre palace sur les coteaux.", "En 1909, l'architecte Laurent Faga ajoute des étages à la Villa Béatrice, son annexe. Dans les années 1950, l'ensemble est transformé en appartements : c'est aujourd'hui l'immeuble Europe-Béatrice."], "l": "La façade sur la rue du Casino et le nom de l'avenue Victoria, souvenir des séjours de la reine d'Angleterre à Aix."}},
 {n:"Le Palace Bernascon",d:"Perché sur les coteaux, boulevard de la Roche-du-Roi, avec vue sur le lac. Ce monument historique a été ravagé par un incendie en 2015, puis restauré.",p:[45.68451,5.91645],x:{"m": ["La famille Bernascon, déjà à la tête de l'Hôtel de l'Europe, fit bâtir ce palace en hauteur, boulevard de la Roche-du-Roi, au tout début du XXe siècle. On l'appelait aussi Régina Bernascon. Sa position domine la ville et le lac.", "Il est représentatif de la grande époque des hôtels dédiés au thermalisme et il est protégé au titre des monuments historiques. Un incendie l'a gravement endommagé en 2015 ; il a depuis fait l'objet d'un important chantier de restauration."], "l": "La vue sur le lac depuis le boulevard. Un peu plus loin, le château de la Roche du Roi."}},
 {n:"Le Splendide",d:"Le premier palace des coteaux (1881-1884), dessiné par Antoine Gouy. Pari audacieux à l'époque, il a été suivi de l'Excelsior et du Royal. Ses salons sont décorés de fresques. La rue honore Georges Ier de Grèce, fidèle curiste de ces palaces.",p:[45.68694,5.91882],x:{"m": ["Inauguré en 1884, c'est le premier des palaces des coteaux, construit de 1881 à 1883 sur des plans d'Antoine Gouy. Le pari était risqué, la ville ne s'étant pas encore développée vers les hauteurs, mais sa clientèle fortunée en fit un succès.", "Il forme le premier élément d'un ensemble prestigieux, le Royal-Splendide-Excelsior, complété par l'Excelsior (1906) et le Royal (1913). Le vestibule et le grand salon, aux décors peints, sont protégés, ainsi que les jardins et terrasses communs au Splendide et au Royal. La rue honore le roi Georges Ier de Grèce, qui venait en cure à Aix chaque été."], "l": "Le parc et la vue. Aujourd'hui en copropriété, les salons s'ouvrent parfois au public, notamment aux Journées du patrimoine."}},
 {n:"L'Excelsior",d:"Ouvert en 1906 à deux pas du Splendide, aujourd'hui Résidence Beauregard. Son escalier d'honneur est réputé. Le Royal (1913), voisin, complète le trio.",p:[45.68627,5.91796],x:{"m": ["Ouvert en 1906 à deux pas du Splendide, par le même entrepreneur, pour accueillir une clientèle toujours plus nombreuse. Les cartes postales de l'époque montrent les deux palaces côte à côte, avec le Revard en toile de fond.", "Devenu la Résidence Beauregard, il est protégé au titre des monuments historiques. Son escalier d'honneur est particulièrement remarquable. Le Royal, achevé en 1913, est juste à côté et clôt la balade en apothéose."], "l": "Les façades du trio Splendide-Excelsior-Royal, à voir ensemble depuis la rue Georges-Ier."}}
];
const X=[["Arc de Campanus",[45.68906,5.91545]],["Temple de Diane",[45.68864,5.91466]],["Palace Royal",[45.68718,5.91890]]];
const $=id=>document.getElementById(id);
let done=new Set(),me=null,meMk=null,acc=null,watch=null,sel=-1;
try{done=new Set(JSON.parse(localStorage.getItem('aix-done')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('aix-done',JSON.stringify([...done]))}catch(e){}};

const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([45.6872,5.9152],16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
L.polyline(S.map(s=>s.p),{color:'#b8862b',weight:4,opacity:.7,dashArray:'2 9',lineCap:'round'}).addTo(map);

const icon=(i,c)=>L.divIcon({className:'',html:`<div class="pin ${c}"><span>${i+1}</span></div>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]});
const mk=S.map((s,i)=>L.marker(s.p,{icon:icon(i,'')}).addTo(map).bindPopup(`<b>${i+1}. ${s.n}</b><br>${s.d}<br><a href="#" data-f="${i}" style="display:inline-block;margin-top:6px;font-weight:600;color:#1f6f8b">En savoir plus →</a>`).on('click',()=>pick(i,false)));
X.forEach(([n,p])=>L.circleMarker(p,{radius:5,color:'#fff',weight:2,fillColor:'#b8862b',fillOpacity:1}).addTo(map).bindTooltip(n,{direction:'top'}));

const dist=(a,b)=>{const R=6371e3,r=Math.PI/180,x=(b[1]-a[1])*r*Math.cos((a[0]+b[0])/2*r),y=(b[0]-a[0])*r;return Math.hypot(x,y)*R};
const fmt=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1).replace('.',',')+' km';
const walk=m=>Math.max(1,Math.round(m/1.25/60))+' min';
const nav=p=>`https://maps.apple.com/?daddr=${p[0]},${p[1]}&dirflg=w`;

function render(){
  $('list').innerHTML=S.map((s,i)=>{
    const d=me?`<span class="dist">${fmt(dist(me,s.p))}</span>`:'';
    return `<li id="s${i}" class="${done.has(i)?'done':''}"><div class="num">${i+1}</div><div class="txt"><h3>${s.n}</h3><p>${s.d}${s.a?' <em>(emplacement approximatif)</em>':''}</p>
    <div class="meta">${d}<button data-f="${i}">En savoir plus</button><a href="${nav(s.p)}" target="_blank" rel="noopener">Itinéraire</a><button data-t="${i}">${done.has(i)?'Annuler':'Vu ✓'}</button></div></div></li>`}).join('')+
    `<li class="foot" style="cursor:default">Positions : base Mérimée (monuments historiques) et adresses publiques. Le tracé pointillé relie les étapes, il ne suit pas les rues.</li>`;
  S.forEach((s,i)=>mk[i].setIcon(icon(i,i===sel?'sel':done.has(i)?'done':'')));
  const nx=S.findIndex((s,i)=>!done.has(i));
  $('next').innerHTML=nx<0?'<b>Balade terminée</b> — bravo !':
   `<span>Prochaine étape</span><b>${nx+1}. ${S[nx].n}</b>${me?`<span class="d">${fmt(dist(me,S[nx].p))} · ${walk(dist(me,S[nx].p))}</span>`:''}`;
  $('next').onclick=()=>nx>=0&&pick(nx,true);
}
function pick(i,fly){sel=i;render();if(fly){map.flyTo(S[i].p,17,{duration:.6});mk[i].openPopup()}
  const el=$('s'+i);el&&el.scrollIntoView({block:'nearest',behavior:'smooth'})}
function fiche(i){const s=S[i];$('fbox').innerHTML=`<div class="top"><span class="num">${i+1}</span><button class="close" aria-label="Fermer">✕</button></div><h2>${s.n}</h2>${s.x.m.map(p=>`<p>${p}</p>`).join('')}<p class="look"><b>À regarder :</b> ${s.x.l}</p>${s.a?'<p style="font-size:13px;color:#6b7280">Emplacement sur la carte approximatif.</p>':''}<div class="nav">${i>0?`<button data-go="${i-1}">← ${i}</button>`:''}<a href="${nav(s.p)}" target="_blank" rel="noopener">Itinéraire</a>${i<S.length-1?`<button data-go="${i+1}">${i+2} →</button>`:''}</div>`;$('fiche').classList.add('open');$('fbox').scrollTop=0}
$('fiche').addEventListener('click',e=>{if(e.target.id==='fiche'||e.target.closest('.close'))$('fiche').classList.remove('open');const g=e.target.closest('[data-go]');if(g){const i=+g.dataset.go;fiche(i);pick(i,true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('fiche').classList.remove('open')});
map.on('popupopen',e=>{const a=e.popup.getElement().querySelector('[data-f]');if(a)a.onclick=ev=>{ev.preventDefault();fiche(+a.dataset.f)}});
$('list').addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){e.stopPropagation();fiche(+f.dataset.f);return}
  const t=e.target.closest('[data-t]');
  if(t){e.stopPropagation();const i=+t.dataset.t;done.has(i)?done.delete(i):done.add(i);save();render();return}
  if(e.target.closest('a'))return;
  const li=e.target.closest('li[id]');if(li)pick(+li.id.slice(1),true);
});

let toastT;function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>m.style.display='none',3500)}
function onPos(pos){
  me=[pos.coords.latitude,pos.coords.longitude];
  if(!meMk){meMk=L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);
    acc=L.circle(me,{radius:pos.coords.accuracy,color:'#2b7cff',weight:1,fillOpacity:.08}).addTo(map);map.flyTo(me,17)}
  else{meMk.setLatLng(me);acc.setLatLng(me).setRadius(pos.coords.accuracy)}
  S.forEach((s,i)=>{if(!done.has(i)&&dist(me,s.p)<35){done.add(i);save();toast('Vous êtes à l\'étape '+(i+1)+' : '+s.n)}});
  render();
}
function locate(){
  if(!navigator.geolocation){toast('Géolocalisation indisponible sur cet appareil');return}
  if(watch!==null){if(me)map.flyTo(me,17);return}
  $('locate').classList.add('on');toast('Recherche de votre position…');
  watch=navigator.geolocation.watchPosition(onPos,err=>{toast(err.code===1?'Autorisez la localisation dans Réglages > Safari':'Position introuvable pour l\'instant');$('locate').classList.remove('on');watch=null},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
$('locate').onclick=locate;
$('fit').onclick=()=>map.fitBounds(L.latLngBounds(S.map(s=>s.p).concat(me?[me]:[])),{padding:[40,40]});

// bottom sheet drag
let h=Math.round(innerHeight*.42);const setH=v=>{h=Math.max(120,Math.min(innerHeight*.85,v));document.documentElement.style.setProperty('--sheet',h+'px');map.invalidateSize()};
let y0=null,h0=0;
$('grip').addEventListener('pointerdown',e=>{y0=e.clientY;h0=h;$('grip').setPointerCapture(e.pointerId)});
$('grip').addEventListener('pointermove',e=>{if(y0!==null)setH(h0+(y0-e.clientY))});
$('grip').addEventListener('pointerup',()=>{y0=null});
setH(h);
map.fitBounds(L.latLngBounds(S.map(s=>s.p)),{padding:[50,50]});
render();
locate();
}
</script>
</body>
</html>

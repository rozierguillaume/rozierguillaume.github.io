<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balade Belle Époque · Aix-les-Bains</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f3;--ink:#1d2430;--mute:#6b7280;--lake:#1f6f8b;--gold:#b8862b;--card:#fff;--line:#e7e0d4;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
#map{position:fixed;inset:0;bottom:var(--sheet,42vh);z-index:1;background:#e8e4dc}
header{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(#fbf8f3f2,#fbf8f3d0 70%,#fbf8f300);pointer-events:none}
header h1{font:700 21px/1.1 "Playfair Display",Georgia,serif;margin:0}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.fab{position:fixed;right:12px;z-index:6;bottom:calc(var(--sheet,42vh) + 12px);display:flex;flex-direction:column;gap:8px}
.fab button{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px #0003;font-size:20px;color:var(--lake);display:grid;place-items:center}
.fab button.on{background:var(--lake);color:#fff}
#sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sheet,42vh);z-index:7;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px #0002;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#grip{padding:8px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
#grip i{width:40px;height:5px;border-radius:3px;background:#d6d0c4}
#next{margin:0 14px 8px;padding:10px 12px;border-radius:12px;background:#f3efe6;font-size:14px;display:flex;gap:10px;align-items:center}
#next b{font-weight:600}
#next .d{margin-left:auto;font-weight:600;color:var(--lake);white-space:nowrap}
ol{list-style:none;margin:0;padding:0 8px 20px;overflow-y:auto;flex:1}
li{display:flex;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
li.done .num{background:#9ca3af}
li.done h3{color:var(--mute);text-decoration:line-through}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;font-weight:600;display:grid;place-items:center;font-size:14px}
.txt{flex:1}
.txt h3{margin:0;font-size:15.5px;font-weight:600}
.txt p{margin:3px 0 0;color:var(--mute);font-size:13.5px}
.meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
.meta a,.meta button{font:500 13px Inter,sans-serif;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--lake);text-decoration:none}
.dist{font-size:13px;font-weight:600;color:var(--lake);white-space:nowrap}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gold);border:2px solid #fff;box-shadow:0 2px 6px #0005;display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font:600 13px Inter,sans-serif}
.pin.done{background:#9ca3af}
.pin.sel{background:var(--lake)}
.me{width:18px;height:18px;border-radius:50%;background:#2b7cff;border:3px solid #fff;box-shadow:0 0 0 6px #2b7cff33}
#msg{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);z-index:8;background:#1d2430;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;display:none;max-width:90vw;text-align:center}
.foot{padding:12px 8px;color:var(--mute);font-size:12px}
.leaflet-popup-content{font:14px/1.4 Inter,sans-serif;margin:10px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<header><h1>Aix-les-Bains Belle Époque</h1><p>9 étapes · ≈ 2,5 à 3 km · 1 h 30</p></header>
<div class="fab">
  <button id="locate" aria-label="Me localiser" title="Me localiser">◎</button>
  <button id="fit" aria-label="Voir tout le parcours" title="Voir tout le parcours">⤢</button>
</div>
<div id="msg"></div>
<section id="sheet">
  <div id="grip"><i></i></div>
  <div id="next"></div>
  <ol id="list"></ol>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
{
const S=[
 {n:"Place du Revard",d:"Point de départ, face au Grand Hôtel. La place doit son nom au train à crémaillère qui montait au Mont Revard.",p:[45.6884,5.9139],a:1},
 {n:"Rue de Genève & ruelle du Revêt",d:"La grande rue commerçante, ancienne route royale, puis une ruelle étroite en coude du centre historique.",p:[45.6893,5.9152],a:1},
 {n:"Place Carnot",d:"L'ancienne « place centrale », où la rue de Genève devenait la route de Chambéry.",p:[45.6886,5.9144],a:1},
 {n:"Hôtel de Ville & Arc de Campanus",d:"L'ancien château des marquis d'Aix et, juste à côté, l'arc funéraire romain (Ier siècle).",p:[45.6889,5.9150]},
 {n:"Casino Grand Cercle",d:"Inauguré en 1850 par Victor-Emmanuel II : plafonds en mosaïque et théâtre à l'italienne.",p:[45.6886,5.9128]},
 {n:"Le Grand Hôtel",d:"1858, place du Revard. Hôtel Royal, puis Impérial, puis Grand-Hôtel d'Aix ; surélevé vers 1900.",p:[45.6881,5.9136]},
 {n:"L'ancien Hôtel de l'Europe",d:"Ancien Hôtel du Globe, tenu par Bernascon ; aujourd'hui l'immeuble Europe-Béatrice, rue du Casino / avenue Victoria.",p:[45.6875,5.9141],a:1},
 {n:"Le Palace Bernascon",d:"6 boulevard de la Roche-du-Roi, sur les coteaux. Restauré après l'incendie de 2015.",p:[45.6845,5.9165]},
 {n:"Splendide, Royal & Excelsior",d:"Rue Georges-Ier : le trio de palaces des coteaux (1884, 1906, 1913). Georges Ier de Grèce y passait ses étés.",p:[45.6869,5.9188],
  extra:[["Excelsior",[45.68627,5.91796]],["Royal",[45.68718,5.91890]],["Splendide",[45.68694,5.91882]]]}
];
const $=id=>document.getElementById(id);
let done=new Set(),me=null,meMk=null,acc=null,watch=null,sel=-1;
try{done=new Set(JSON.parse(localStorage.getItem('aix-done')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('aix-done',JSON.stringify([...done]))}catch(e){}};

const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([45.6872,5.9152],16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
L.polyline(S.map(s=>s.p),{color:'#b8862b',weight:4,opacity:.7,dashArray:'2 9',lineCap:'round'}).addTo(map);

const icon=(i,c)=>L.divIcon({className:'',html:`<div class="pin ${c}"><span>${i+1}</span></div>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]});
const mk=S.map((s,i)=>L.marker(s.p,{icon:icon(i,'')}).addTo(map).bindPopup(`<b>${i+1}. ${s.n}</b><br>${s.d}`).on('click',()=>pick(i,false)));
S.forEach(s=>(s.extra||[]).forEach(([n,p])=>L.circleMarker(p,{radius:5,color:'#fff',weight:2,fillColor:'#b8862b',fillOpacity:1}).addTo(map).bindTooltip(n,{direction:'top'})));

const dist=(a,b)=>{const R=6371e3,r=Math.PI/180,x=(b[1]-a[1])*r*Math.cos((a[0]+b[0])/2*r),y=(b[0]-a[0])*r;return Math.hypot(x,y)*R};
const fmt=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1).replace('.',',')+' km';
const walk=m=>Math.max(1,Math.round(m/1.25/60))+' min';
const nav=p=>`https://maps.apple.com/?daddr=${p[0]},${p[1]}&dirflg=w`;

function render(){
  $('list').innerHTML=S.map((s,i)=>{
    const d=me?`<span class="dist">${fmt(dist(me,s.p))}</span>`:'';
    return `<li id="s${i}" class="${done.has(i)?'done':''}"><div class="num">${i+1}</div><div class="txt"><h3>${s.n}</h3><p>${s.d}${s.a?' <em>(emplacement approximatif)</em>':''}</p>
    <div class="meta">${d}<a href="${nav(s.p)}" target="_blank" rel="noopener">Itinéraire</a><button data-t="${i}">${done.has(i)?'Annuler':'Vu ✓'}</button></div></div></li>`}).join('')+
    `<li class="foot" style="cursor:default">Positions : base Mérimée (monuments historiques) et adresses publiques. Le tracé pointillé relie les étapes, il ne suit pas les rues.</li>`;
  S.forEach((s,i)=>mk[i].setIcon(icon(i,i===sel?'sel':done.has(i)?'done':'')));
  const nx=S.findIndex((s,i)=>!done.has(i));
  $('next').innerHTML=nx<0?'<b>Balade terminée</b> — bravo !':
   `<span>Prochaine étape</span><b>${nx+1}. ${S[nx].n}</b>${me?`<span class="d">${fmt(dist(me,S[nx].p))} · ${walk(dist(me,S[nx].p))}</span>`:''}`;
  $('next').onclick=()=>nx>=0&&pick(nx,true);
}
function pick(i,fly){sel=i;render();if(fly){map.flyTo(S[i].p,17,{duration:.6});mk[i].openPopup()}
  const el=$('s'+i);el&&el.scrollIntoView({block:'nearest',behavior:'smooth'})}
$('list').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');
  if(t){e.stopPropagation();const i=+t.dataset.t;done.has(i)?done.delete(i):done.add(i);save();render();return}
  if(e.target.closest('a'))return;
  const li=e.target.closest('li[id]');if(li)pick(+li.id.slice(1),true);
});

let toastT;function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>m.style.display='none',3500)}
function onPos(pos){
  me=[pos.coords.latitude,pos.coords.longitude];
  if(!meMk){meMk=L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);
    acc=L.circle(me,{radius:pos.coords.accuracy,color:'#2b7cff',weight:1,fillOpacity:.08}).addTo(map);map.flyTo(me,17)}
  else{meMk.setLatLng(me);acc.setLatLng(me).setRadius(pos.coords.accuracy)}
  S.forEach((s,i)=>{if(!done.has(i)&&dist(me,s.p)<35){done.add(i);save();toast('Vous êtes à l\'étape '+(i+1)+' : '+s.n)}});
  render();
}
function locate(){
  if(!navigator.geolocation){toast('Géolocalisation indisponible sur cet appareil');return}
  if(watch!==null){if(me)map.flyTo(me,17);return}
  $('locate').classList.add('on');toast('Recherche de votre position…');
  watch=navigator.geolocation.watchPosition(onPos,err=>{toast(err.code===1?'Autorisez la localisation dans Réglages > Safari':'Position introuvable pour l\'instant');$('locate').classList.remove('on');watch=null},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
$('locate').onclick=locate;
$('fit').onclick=()=>map.fitBounds(L.latLngBounds(S.map(s=>s.p).concat(me?[me]:[])),{padding:[40,40]});

// bottom sheet drag
let h=Math.round(innerHeight*.42);const setH=v=>{h=Math.max(120,Math.min(innerHeight*.85,v));document.documentElement.style.setProperty('--sheet',h+'px');map.invalidateSize()};
let y0=null,h0=0;
$('grip').addEventListener('pointerdown',e=>{y0=e.clientY;h0=h;$('grip').setPointerCapture(e.pointerId)});
$('grip').addEventListener('pointermove',e=>{if(y0!==null)setH(h0+(y0-e.clientY))});
$('grip').addEventListener('pointerup',()=>{y0=null});
setH(h);
map.fitBounds(L.latLngBounds(S.map(s=>s.p)),{padding:[50,50]});
render();
locate();
}
</script>
</body>
</html>
